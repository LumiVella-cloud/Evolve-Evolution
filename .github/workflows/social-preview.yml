name: Publish raster social preview
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-dejavu-core
          rsvg-convert -w 1200 -h 630 social-preview.svg -o social-preview.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('https://evolve-evolution.co.za/social-preview.svg','https://evolve-evolution.co.za/social-preview.png')
          s = s.replace('name="twitter:card" content="summary"','name="twitter:card" content="summary_large_image"')
          p.write_text(s)
          PY
      - name: Commit generated artwork and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview.png index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish raster social preview"
          git push origin HEAD:main
